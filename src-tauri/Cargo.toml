[package]
name = "termax"
version = "0.1.0"
description = "Terminal multiplexer and project manager for AI coding agents"
license = "MIT"
edition = "2021"

[lib]
name = "termax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
notify = "8"
similar = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
dirs = "6"

[profile.release]
lto = true
codegen-units = 1
